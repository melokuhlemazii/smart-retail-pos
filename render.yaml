services:
  - type: web
    name: smart-retail-pos
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt && python -c "from app import create_app, db; app = create_app(); app.app_context().push(); db.create_all()"
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false





